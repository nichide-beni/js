<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サンプル3 外部API</title>
  <style>
    th, td { padding: 10px; }
  </style>
</head>
<body>
  <h1>サンプル3 外部API</h1>

  <script>
    async function thenApi() {
      /* then: awaitと同じく、「成功した場合に次の処理に移る」という特徴を持つ。失敗した場合はcatchを書いている場合はそこに移行する */
      fetch('https://jsonplaceholder.typicode.com/users/1')
      .then(response => response.json())
      .then(data => {
        console.log('ユーザー名:', data.name);
      })
      .catch(error => {
        console.error('通信エラー:', error);
      });
    }
    thenApi();

    /* await比較版 */
    async function awaitApi() {
      // 失敗(例外)が発生した場合に「catch」の箇所に「ジャンプ」する
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
        const data = await response.json();
        console.log('[await]ユーザー名', data.name);
      } catch(error) {
        console.error('[await]通信エラー', error);
      }
    }
    awaitApi();

  </script>
</body>
</html>
