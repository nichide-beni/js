<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演習3-2 外部API 外部APIの結果をHTMLに反映</title>
  <style>
    th, td { padding: 10px; }
  </style>
</head>
<body>
  <h1>演習3-2 外部API 外部APIの結果をHTMLに反映</h1>

  <!-- [記述]ボタンを押したらavatarに結果を反映 -->
  <img id="avatar" src="" alt="アバター画像" width="200" />
  <button onclick="showRandom()">画像を取得</button>


  <script>
    /**
     * ボタンを押すたび画像の結果が変わる問題
     * フリー記述のため難易度は高め
     * 以下のAPIを実行し、画像を切り替える
     * JSONの「message」に画像のURLが存在するので、avatarの参照先を切り替える処理を記述する
     * https://dog.ceo/api/breeds/image/random
    */

    async function showRandom() {
      const response = await fetch('https://dog.ceo/api/breeds/image/random');
      const data = await response.json();
      document.getElementById('avatar').src = data.message;
    }

  </script>
</body>
</html>
