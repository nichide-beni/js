<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サンプル2 同期処理と非同期処理</title>
  <style>
    th, td { padding: 10px; }
  </style>
</head>
<body>
  <h1>サンプル2 同期処理と非同期処理</h1>

  <script>
    // 同期処理として実行
    async function fetchWithAwait() {
      console.log('同期処理の処理開始');
      const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
      const data = await response.json();
      console.log('同期処理の取得結果:', data.title);
      console.log('同期処理の処理終了');
    }

    // 非同期処理として実行
    async function fetchWithoutAwait() {
      console.log('非同期処理の処理開始');
      const response = fetch('https://jsonplaceholder.typicode.com/posts/1');
      console.log('非同期処理の取得結果:', response); // Promiseオブジェクト
      console.log('非同期処理の処理終了');
    }

    fetchWithAwait();
    fetchWithoutAwait();

  </script>
</body>
</html>
