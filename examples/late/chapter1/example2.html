        // よく使う宣言方式
        class Animal {
            name;
            sound = 'speak';
            #age;

            constructor(name, sound, age) {
                this.name = name;
                this.sound = sound;
                this.#age = age;
            }

            setAge(age) {
                this.#age = age;
            }

            getAge() {
                return this.#age;
            }
        }
