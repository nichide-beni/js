<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-2 クラスの使い方</title>
</head>
<body>
    <script>
        // よく使う宣言方式
        class Animal {
            name;
            sound = 'speak';
            #age;

            constructor(name, sound, age) {
                this.name = name;
                this.sound = sound;
                this.#age = age;
            }

            setAge(age) {
                this.#age = age;
            }

            getAge() {
                return this.#age;
            }
        }

        // 10歳のワンと鳴く犬を宣言しよう
        const dog = new Animal('犬', 'ワン', 10);
        // 3歳のコケコッコーと鳴くニワトリを宣言しよう
        const chicken = new Animal('ニワトリ', 'コケコッコー', 3);
        // 「sample2.html」のコンソール文を使って、犬とニワトリの情報を表示してみよう。
        console.log(`${dog.name}は${dog.getAge()}歳で${dog.sound}と鳴く`);
        console.log(`${chicken.name}は${chicken.getAge()}歳で${chicken.sound}と鳴く`);
        // クラスの情報を使って、「5歳歳をとった」ことを反映しよう
        dog.setAge(15);
        chicken.setAge(8);
        // 「sample2.html」のコンソール文を使って、5年後の犬とニワトリの情報を表示してみよう。
        console.log(`${dog.name}は${dog.getAge()}歳で${dog.sound}と鳴く`);
        console.log(`${chicken.name}は${chicken.getAge()}歳で${chicken.sound}と鳴く`);
    </script>
</body>
</html>
