    <title>1-4-1 クラスの継承を書いてみよう</title>
</head>
<body>
    <script>
        class Parent {
            display() {
                console.log('子クラスで表示させます。');
            }
        }

        class Child {

        }

        // childからdisplayメソッドが実行できるようにParentクラスを継承させよう
        const child = new Child();
    </script>
</body>
