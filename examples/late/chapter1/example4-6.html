<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-4-6 子クラスから静的プロパティを呼んでみよう</title>
</head>
<body>
    <script>
        class Parent {
            static name = '親クラス';

            static display() {
                console.log(`${Parent.name}のコンソールです`);
            }
        }

        class Child extends Parent {

        }

        // Childクラスを使って「親クラスのコンソールです」と表示されるように調整しよう
    </script>
</body>
</html>
