<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-4-2 子クラスから親クラスのコンストラクタを呼んでみよう</title>
</head>
<body>
    <script>
        class Parent {
            constructor() {
                console.log('親クラスのコンソールです');
            }
        }

        class Child {
            constructor() {
                console.log('小クラスのコンソールです');
            }
        }

        // コンソールで、「親クラスのコンソールです」→「小クラスのコンソールです」と表示されるようにプログラムを調整しよう
    </script>
</body>
</html>
